<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} – {{ title }} – Insel Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="page-bg"><div class="bg-grid"></div><div class="bg-radial"></div></div>
<div class="error-wrap">
  <div class="error-card">
    <div class="error-icon">{{ icon }}</div>
    <h1 class="error-title">{{ code }} – {{ title }}</h1>
    <p class="error-msg">{{ msg }}</p>
    <div class="btn-dash-group">
      <a href="{{ url_for('dashboard') }}" class="btn-dash primary">← Dashboard</a>
      <a href="{{ url_for('logout') }}" class="btn-dash ghost">Abmelden</a>
    </div>
  </div>
</div>
</body>
</html>
